[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "channel-publisher-bot"
version = "1.0.0"
description = "Telegram channel publisher with templates and persistent auto-delete"
requires-python = ">=3.10"
dependencies = [
  "httpx==0.28.1",
  "python-dotenv==1.1.1",
]

[tool.setuptools.packages.find]
include = ["bot*"]
